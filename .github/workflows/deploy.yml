# GitHub Actions workflow to build Zola site and deploy to GitHub Pages

name: Build and Deploy Zola Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Zola Docker image
        run: docker pull zola:latest

      - name: Build Zola site using Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/site \
            zola build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Uncomment the following line if you want to keep the history of deployments
          # keep_files: true
          # Uncomment and set a custom domain if needed
          # cname: janligudzinski.com
